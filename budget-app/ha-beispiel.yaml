budget_ausgaben_lesen:
  alias: "Budget: Ausgaben lesen"
  description: "Liest gebuchte Ausgaben, optional nach Zeitraum und Suchwort. Erstattungen erscheinen als negative Beträge. Salden und Einnahmen sind bewusst nicht verfügbar."
  icon: mdi:cash-multiple
  mode: parallel
  fields:
    von:
      description: "Ab Datum JJJJ-MM-TT"
      required: false
      selector:
        text: {}
    bis:
      description: "Bis Datum JJJJ-MM-TT"
      required: false
      selector:
        text: {}
    suche:
      description: "Suchwort in Beschreibung oder Notiz"
      required: false
      selector:
        text: {}
  sequence:
  - action: rest_command.budget
    data:
      werkzeug: ausgaben_lesen
      daten:
        von: "{{ von | default('') }}"
        bis: "{{ bis | default('') }}"
        suche: "{{ suche | default('') }}"
    response_variable: r
  - variables:
      antwort: "{{ {'ergebnis': r.content} }}"
  - stop: Fertig
    response_variable: antwort

