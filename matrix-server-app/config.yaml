name: "Matrix-Server"
description: "Matrix-Homeserver (Continuwuity) mit Föderation; meldet Bridges aus /share/matrix/appservices selbst an"
version: "26.9.1-1"
slug: "matrix_server"
url: "https://continuwuity.org"
arch:
  - aarch64
  - amd64
startup: services
boot: auto
init: false
map:
  - type: share
    read_only: true
ports:
  8008/tcp: 8008
ports_description:
  8008/tcp: "Matrix für Apps und andere Server (über den Reverse Proxy per HTTPS freigeben)"
watchdog: "tcp://[HOST]:[PORT:8008]"
environment:
  TZ: "Europe/Berlin"
options:
  server_name: ""
  foederation: true
  registrierungs_token: ""
schema:
  server_name: match(^[a-z0-9]([a-z0-9.-]*[a-z0-9])?$)
  foederation: bool
  registrierungs_token: "password?"
