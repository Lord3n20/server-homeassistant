name: "Claude Mail & Kalender (MCP)"
description: "IMAP/SMTP-Mail und CalDAV-Kalender als eigener Connector für claude.ai (claude-mail-mcp mit OAuth)"
version: "0.7.2-1"
slug: "claude_mail_mcp"
url: "https://github.com/YannicHock/claude-mail-mcp"
arch:
  - aarch64
  - amd64
startup: application
boot: auto
ports:
  8080/tcp: 8787
ports_description:
  8080/tcp: "OAuth-Endpunkt für claude.ai (nur über HTTPS-Tunnel/Proxy freigeben)"
watchdog: "tcp://[HOST]:[PORT:8080]"
options:
  public_url: ""
  log_level: info
schema:
  public_url: str
  log_level: list(debug|info|warn|error)
