configuration:
  webdav_url:
    name: WebDAV-Adresse
    description: z. B. https://nx….your-storageshare.de/remote.php/dav/files/BENUTZER
  benutzer:
    name: Nextcloud-Benutzer
  app_passwort:
    name: App-Passwort
    description: In Nextcloud unter Einstellungen → Sicherheit erzeugen
  ordner:
    name: Ordner
    description: name = Unterordner in der Freigabe, pfad = Pfad in der Nextcloud
  ram_cache_mb:
    name: RAM-Cache (MB)
    description: Obergrenze für den Datei-Cache im Arbeitsspeicher (tmpfs), nichts landet auf der Platte
