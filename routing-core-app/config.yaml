name: "SchnellWeg routing-core"
description: "ÖPNV-Routing (RAPTOR) für die Region Aachen, API für die SchnellWeg-App"
version: "0.1.11"
slug: "routing_core"
url: "https://github.com/Lord3n20/SchnellWeg"
# Fertiges Image aus dem CI von SchnellWeg (D-03), nichts wird auf dem HA-Host gebaut.
# Digest je Version steht in README.md (Tabelle „Versionen“).
image: "ghcr.io/lord3n20/schnellweg-routing-core"
arch:
  - amd64
startup: services
boot: auto
init: false
map:
  - type: addon_config
    read_only: true
  # Fahrpläne aus dem Job-Add-on (gtfs/current)
  - type: all_addon_configs
    read_only: true
backup_exclude:
  - "*.zip"
  - "*.csv"
ports:
  8090/tcp: 8090
ports_description:
  8090/tcp: "Routing-API (nur über den Reverse Proxy mit Client-Zertifikat freigeben)"
watchdog: "tcp://[HOST]:[PORT:8090]"
environment:
  TZ: "Europe/Berlin"
  GOMEMLIMIT: "200MiB"
  GOMAXPROCS: "2"
options:
  gtfs: "sr_gtfs.zip,de_rv.zip,de_fv.zip:fern"
  gtfs_dir: "/addon_configs/*_routing_jobs/gtfs/current"
  footpaths: "/addon_configs/*_routing_jobs/footpaths/current/footpaths.csv"
  geocode: "/addon_configs/*_routing_jobs/geocode/current/geocode.tsv,/addon_configs/*_routing_jobs/rwth/current/gebaeude.tsv"
  map: "/addon_configs/*_routing_jobs/map/current/region.pmtiles"
  rt: "https://realtime.gtfs.de/realtime-free.pb"
  walk: 400
  access: 800
  valhalla: "http://91c9b2fc-valhalla:8002"
  par: 2
schema:
  gtfs: match(^[A-Za-z0-9_.\-]+(:fern)?(,[A-Za-z0-9_.\-]+(:fern)?)*$)
  gtfs_dir: "str?"
  footpaths: "str?"
  geocode: "str?"
  map: "str?"
  rt: "str?"
  walk: int(100,1000)
  access: int(200,2000)
  valhalla: "url?"
  par: int(1,4)
