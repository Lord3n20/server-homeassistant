name: Minecraft Server
description: minecraft server with itzg/minecraft-server
slug: minecraft_server
homeassistant_api: true
version: "3.5.0"
arch:
  - aarch64
  - amd64
startup: services
ingress: true
ingress_port: 8099
panel_icon: mdi:minecraft
panel_title: Minecraft-Konsole
panel_admin: true
ports:
  25565/tcp: 25565
  24454/udp: 24454
environment:
  EULA: "TRUE"
  TZ: "Europe/Berlin"
  DIFFICULTY: "2"
  MAX_PLAYERS: "10"
  MOTD: "Stierzunge"
  SERVER_PORT: "25565"
  TYPE: "PAPER"
  MODRINTH_PROJECTS: "voxy-server-side?,chunky?"
options:
  version: "LATEST"
  welt: "world"
  max_memory: "4G"
  init_memory: "1G"
  view_distance: 12
  simulation_distance: 8
  enforce_whitelist: true
  enable_status: false
  prevent_proxy_connections: true
  rate_limit: 500
schema:
  version: match(^(LATEST|[0-9]+(\.[0-9]+){1,2})$)
  welt: match(^[A-Za-z0-9_-]+$)
  max_memory: match(^[0-9]+[MG]$)
  init_memory: match(^[0-9]+[MG]$)
  view_distance: int(3,32)
  simulation_distance: int(3,32)
  enforce_whitelist: bool
  enable_status: bool
  prevent_proxy_connections: bool
  rate_limit: int(0,10000)
