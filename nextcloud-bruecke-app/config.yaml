name: "Nextcloud-Brücke"
description: "Bindet Nextcloud-Ordner per WebDAV nur lesend ein (ohne Plattencache) und gibt sie im internen Netz per SMB frei, z. B. für Immich"
version: "0.1.0"
slug: "nextcloud_bruecke"
arch:
  - aarch64
  - amd64
startup: system
boot: auto
init: false
apparmor: false
privileged:
  - SYS_ADMIN
devices:
  - /dev/fuse
watchdog: "tcp://[HOST]:445"
environment:
  TZ: "Europe/Berlin"
options:
  webdav_url: ""
  benutzer: ""
  app_passwort: ""
  ordner:
    - name: "Bilder"
      pfad: "Bilder"
  smb_benutzer: "immich"
  smb_passwort: ""
  ram_puffer_mb: 32
schema:
  webdav_url: url
  benutzer: str
  app_passwort: password
  ordner:
    - name: match(^[A-Za-z0-9_\-]+$)
      pfad: str
  smb_benutzer: match(^[a-z][a-z0-9_\-]*$)
  smb_passwort: password
  ram_puffer_mb: int(0,512)
