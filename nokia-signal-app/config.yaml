name: "Nokia-Signal"
description: "Signal als verknüpftes Gerät, verschlüsselt erreichbar für ein altes Nokia (J2ME)"
version: "1.0.5"
slug: "nokia_signal"
arch:
  - amd64
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: "mdi:message-lock"
panel_title: "Nokia-Signal"
panel_admin: true
ports:
  8080/tcp: 8791
ports_description:
  8080/tcp: "Schnittstelle für das Handy (über den Reverse Proxy freigeben, Inhalt ist verschlüsselt)"
watchdog: "tcp://[HOST]:[PORT:8080]"
options:
  schluessel: ""
  anruf_nummer: ""
  sip_server: "fritz.box"
  sip_benutzer: ""
  sip_passwort: ""
  klingeln_sekunden: 15
  weitere_nummern: []
  lesebestaetigungen: true
schema:
  schluessel: "password?"
  anruf_nummer: "str?"
  sip_server: "str?"
  sip_benutzer: "str?"
  sip_passwort: "password?"
  klingeln_sekunden: "int(5,40)?"
  lesebestaetigungen: "bool?"
  weitere_nummern:
    - sip_benutzer: str
      sip_passwort: password
      chats: str
