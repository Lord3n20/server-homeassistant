configuration:
  gtfs:
    name: GTFS-Feeds
    description: Dateien im App-Konfigurationsordner, durch Komma getrennt. „:fern“ markiert einen Feed als Fernverkehr (nicht im Deutschlandticket)
  gtfs_dir:
    name: Fahrplan-Ordner
    description: Ordner der GTFS-Feeds (Stern erlaubt), Standard ist der aktuelle Stand des Job-Add-ons. Leer lassen, dann der eigene Konfigurationsordner
  footpaths:
    name: Fußwege
    description: Vorab berechnete Valhalla-Fußwege (CSV, Stern erlaubt), Standard ist der Stand des Job-Add-ons. Leer oder nicht gefunden: Luftlinie
  walk:
    name: Umstiegsweg (m)
    description: Längster Fußweg zwischen zwei Halten (Luftlinie); Valhalla-Wege bis zum Doppelten
  access:
    name: Zugangsweg (m)
    description: Suchradius für Halte um Start und Ziel (Luftlinie); mit Valhalla echte Wege bis zum Doppelten
  valhalla:
    name: Valhalla
    description: Adresse der Valhalla-App für echte Zugangswege. Leer lassen, dann gilt die Luftlinie
  par:
    name: Gleichzeitige Anfragen
    description: Mehr Anfragen gleichzeitig kosten mehr RAM
network:
  8090/tcp: Routing-API, nur über den Reverse Proxy mit Client-Zertifikat freigeben
