# Für configuration.yaml, Block rest_command:
#
#   budget:
#     url: "http://91c9b2fc-budget:8098/werkzeug/{{ werkzeug }}"
#     method: POST
#     content_type: application/json
#     payload: "{{ daten | tojson }}"
#     timeout: 20
#
# Für scripts.yaml:

budget_kategorien:
  alias: "Budget: Kategorien und Zahlkonten"
  description: "Listet die gültigen Ausgabenkategorien und die Namen der Zahlkonten, ohne Salden. Vor dem ersten Vorschlag aufrufen."
  icon: mdi:cash-multiple
  mode: parallel
  sequence:
  - action: rest_command.budget
    data:
      werkzeug: kategorien_und_zahlkonten
      daten: {}
    response_variable: r
  - variables:
      antwort: "{{ {'ergebnis': r.content} }}"
  - stop: Fertig
    response_variable: antwort

budget_ausgabe_vorschlagen:
  alias: "Budget: Ausgabe vorschlagen"
  description: "Legt eine Ausgabe, etwa von einem Kassenbon, als Vorschlag an und prüft Summe und Duplikate. Bucht noch nicht. Das Ergebnis dem Nutzer zeigen und erst nach seinem OK bestätigen. Einnahmen, Erstattungen und Umbuchungen trägt der Nutzer selbst ein."
  icon: mdi:cash-multiple
  mode: parallel
  fields:
    datum:
      description: "Datum als JJJJ-MM-TT"
      required: true
      selector:
        text: {}
    beschreibung:
      description: "Händler oder Zweck"
      required: true
      selector:
        text: {}
    zahlkonto:
      description: "Name des Zahlkontos aus budget_kategorien"
      required: true
      selector:
        text: {}
    positionen:
      description: "JSON-Liste, z. B. [{\"kategorie\": \"Ausgaben:Lebensmittel\", \"betrag\": \"12,34\", \"memo\": \"Äpfel\"}]"
      required: true
      selector:
        text: {}
    bonsumme:
      description: "Summe laut Bon, wird gegen die Positionen geprüft"
      required: false
      selector:
        text: {}
  sequence:
  - action: rest_command.budget
    data:
      werkzeug: ausgabe_vorschlagen
      daten:
        datum: "{{ datum }}"
        beschreibung: "{{ beschreibung }}"
        zahlkonto: "{{ zahlkonto }}"
        positionen: "{{ positionen }}"
        bonsumme: "{{ bonsumme | default('') }}"
    response_variable: r
  - variables:
      antwort: "{{ {'ergebnis': r.content} }}"
  - stop: Fertig
    response_variable: antwort

budget_ausgabe_bestaetigen:
  alias: "Budget: Ausgabe buchen"
  description: "Bucht einen Vorschlag, nachdem der Nutzer ihn bestätigt hat. Ein zweiter Aufruf bucht nicht noch einmal."
  icon: mdi:cash-multiple
  mode: parallel
  fields:
    vorschlag_id:
      description: "Nummer aus dem Vorschlag"
      required: true
      selector:
        text: {}
    trotz_duplikat:
      description: "Nur true, wenn der Nutzer ein mögliches Duplikat ausdrücklich bestätigt hat"
      required: false
      selector:
        boolean: {}
  sequence:
  - action: rest_command.budget
    data:
      werkzeug: ausgabe_bestaetigen
      daten:
        vorschlag_id: "{{ vorschlag_id }}"
        trotz_duplikat: "{{ trotz_duplikat | default('') }}"
    response_variable: r
  - variables:
      antwort: "{{ {'ergebnis': r.content} }}"
  - stop: Fertig
    response_variable: antwort

budget_vorschlag_verwerfen:
  alias: "Budget: Vorschlag verwerfen"
  description: "Verwirft einen offenen Vorschlag."
  icon: mdi:cash-multiple
  mode: parallel
  fields:
