name: "Nokia-Brücke"
description: "Schlanke HTTP-Schnittstelle, damit ein altes Nokia (J2ME) das Dashboard anzeigen und schalten kann"
version: "1.0.1"
slug: "nokia_bridge"
arch:
  - aarch64
  - amd64
startup: application
boot: auto
homeassistant_api: true
ports:
  8080/tcp: 8790
ports_description:
  8080/tcp: "Nur-HTTP-Schnittstelle für das Handy (über den Reverse Proxy freigeben)"
watchdog: "tcp://[HOST]:[PORT:8080]"
options:
  schluessel: ""
schema:
  schluessel: "password?"
