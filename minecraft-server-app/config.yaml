name: Minecraft Server
description: minecraft server with itzg/minecraft-server
slug: minecraft_server
homeassistant_api: true
version: "3.2.0"
arch:
  - aarch64
  - amd64
startup: services
ports:
  25565/tcp: 25565
  24454/udp: 24454
environment:
  EULA: "TRUE"
  DIFFICULTY: "2"
  MAX_PLAYERS: "10"
  MOTD: "Stierzunge"
  SERVER_PORT: "25565"
  TYPE: "PAPER"
options:
  max_memory: "4G"
  init_memory: "1G"
  view_distance: 12
  simulation_distance: 8
schema:
  max_memory: match(^[0-9]+[MG]$)
  init_memory: match(^[0-9]+[MG]$)
  view_distance: int(3,32)
  simulation_distance: int(3,32)
