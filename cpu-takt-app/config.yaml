name: "CPU-Mindesttakt"
description: "Setzt beim Start den Mindesttakt der CPU (schedutil bleibt), damit kurze Anfragen nicht bei 0,8 GHz laufen; beendet sich danach"
version: "0.1.2"
slug: "cpu_takt"
arch:
  - amd64
startup: initialize
boot: auto
init: false
# /sys ist im Container schreibgeschützt; mit SYS_ADMIN (ohne AppArmor-Sperre) hängt run.sh es im Container
# beschreibbar um. Kein voller Zugriff, keine Geräte, keine Ports.
privileged:
  - SYS_ADMIN
apparmor: false
options:
  min_mhz: 2000
schema:
  min_mhz: int(800,3900)
