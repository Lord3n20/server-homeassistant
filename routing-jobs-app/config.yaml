name: "SchnellWeg routing-jobs"
description: "Datenjobs für SchnellWeg: Fahrpläne, OSM-Ausschnitt der Region Aachen, Valhalla-Tiles, Fußwege, Suchliste, Karte und RWTH-Gebäude (beendet sich selbst)"
version: "0.1.8"
slug: "routing_jobs"
url: "https://github.com/Lord3n20/SchnellWeg"
# Fertiges Image aus dem CI von SchnellWeg (D-03). Digest je Version steht in README.md.
image: "ghcr.io/lord3n20/schnellweg-routing-jobs"
arch:
  - amd64
# Einmal-Job: nur per HA-Automation starten (hassio.addon_start), kein Scheduler im Container.
startup: once
boot: manual
init: false
map:
  - type: addon_config
    read_only: false
# Große, reproduzierbare Daten nicht ins Backup
backup_exclude:
  - "*.pbf"
  - "*.zip"
  - "*.csv"
  - "*.tsv"
  - "*.pmtiles"
  - "*.o5m"
  - "*.tar"
  - "*.sqlite"
  - "*.part"
  - "*.log"
# Benachrichtigung (Core-API) und Neustart des Valhalla-Add-ons nach neuem Stand (Supervisor-API)
homeassistant_api: true
hassio_api: true
hassio_role: manager
environment:
  TZ: "Europe/Berlin"
  GOMEMLIMIT: "100MiB"
options:
  job: "gtfs,osm,valhalla,footpaths,geocode,map,rwth"
  map_box: "5.95,50.48,6.45,50.93"
  map_zoom: 15
  gtfs_box: "5.95,50.48,6.45,50.93"
  osm_tage: 7
  osm_sources:
    - "europe/germany/nordrhein-westfalen/koeln-regbez"
    - "europe/germany/nordrhein-westfalen/duesseldorf-regbez"
    - "europe/germany/rheinland-pfalz"
    - "europe/netherlands/limburg"
    - "europe/belgium"
  max_mem_mb: 2048
  concurrency: 4
  force: false
schema:
  job: match(^(gtfs|osm|valhalla|footpaths|geocode|map|rwth)(,(gtfs|osm|valhalla|footpaths|geocode|map|rwth))*$)
  map_box: match(^-?[0-9.]+,-?[0-9.]+,-?[0-9.]+,-?[0-9.]+$)
  map_zoom: int(10,16)
  gtfs_box: match(^-?[0-9.]+,-?[0-9.]+,-?[0-9.]+,-?[0-9.]+$)
  osm_tage: int(0,30)
  osm_sources:
    - match(^[a-z0-9\-]+(/[a-z0-9\-]+)*$)
  max_mem_mb: int(1024,2048)
  concurrency: int(1,4)
  force: bool
