configuration:
  webdav_url:
    name: WebDAV URL
    description: e.g. https://nx….your-storageshare.de/remote.php/dav/files/BENUTZER
  benutzer:
    name: Nextcloud user
  app_passwort:
    name: App password
    description: Create in Nextcloud under Settings → Security
  ordner:
    name: Folders
    description: name = subfolder in the export, pfad = path in Nextcloud
  ram_cache_mb:
    name: RAM cache (MB)
    description: Upper limit for the file cache in memory (tmpfs), nothing is written to disk
