configuration:
  job:
    name: Jobs
    description: Comma separated, run one after another (gtfs, osm, valhalla)
  gtfs_box:
    name: Local transit box
    description: Trips with at least one stop in this rectangle (minlon,minlat,maxlon,maxlat) go into the timetable
  osm_tage:
    name: OSM interval (days)
    description: Rebuild OSM and Valhalla only when the data is this old (0 = check on every run)
  osm_sources:
    name: OSM sources
    description: Geofabrik paths without "-latest.osm.pbf"; together they must cover the region polygon
  max_mem_mb:
    name: Peak memory (MB)
    description: The job aborts if it uses more; never more than free memory minus 1 GB
  concurrency:
    name: Threads
    description: Threads for the Valhalla build (at most 4 so other services keep enough CPU)
  force:
    name: Force rebuild
    description: Rebuild even if the sources did not change
