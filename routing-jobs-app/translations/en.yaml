configuration:
  job:
    name: Jobs
    description: Comma separated, run one after another (gtfs, osm, valhalla, footpaths, geocode, map, rwth)
  gtfs_box:
    name: Local transit box
    description: Trips with at least one stop in this rectangle (minlon,minlat,maxlon,maxlat) go into the timetable
  osm_tage:
    name: OSM interval (days)
    description: Rebuild OSM and Valhalla only when the data is this old (0 = check on every run)
  map_box:
    name: Map extract
    description: Whole map extent, all regions lie inside (minlon,minlat,maxlon,maxlat)
  map_zoom:
    name: Map zoom
    description: Highest zoom level; each extra level roughly quadruples the size
  osm_sources:
    name: OSM sources
    description: Geofabrik paths without "-latest.osm.pbf"; together they must cover the region polygon
  geocode_sources:
    name: Address search sources
    description: Whole Geofabrik areas without "-latest.osm.pbf" (e.g. europe/germany); independent of the region polygon
  max_mem_mb:
    name: Peak memory (MB)
    description: The job aborts if it uses more; never more than free memory minus 1 GB
  concurrency:
    name: Threads
    description: Threads for the Valhalla build (at most 4 so other services keep enough CPU)
  force:
    name: Force rebuild
    description: Rebuild even if the sources did not change
  map_uebersicht_zoom:
    name: Overview zoom
    description: "Overview: highest zoom level (whole map extent, coarse)"
  map_tage:
    name: "Map: days until refresh"
    description: Refresh the map only when it is this old (0 = always check)
