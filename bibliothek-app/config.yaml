name: "Bibliothek"
description: "Bücher per ISBN erfassen, im Panel sortieren und als Unterseite der Website veröffentlichen"
version: "1.1.1"
slug: "bibliothek"
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:bookshelf
panel_title: Bibliothek
panel_admin: true
watchdog: "tcp://[HOST]:[PORT:8099]"
map:
  - type: media
    read_only: false
environment:
  TZ: "Europe/Berlin"
options:
  website_ordner: "website/bibliothek"
schema:
  website_ordner: match(^[A-Za-z0-9_\-]+(/[A-Za-z0-9_\-]+)*$)
