configuration:
  gtfs:
    name: GTFS-Feeds
    description: Dateien im App-Konfigurationsordner, durch Komma getrennt. „:fern“ markiert einen Feed als Fernverkehr (nicht im Deutschlandticket)
  footpaths:
    name: Fußwege
    description: Vorab berechnete Valhalla-Fußwege (CSV). Leer lassen, dann gilt die Luftlinie
  walk:
    name: Umstiegsweg (m)
    description: Längster Fußweg zwischen zwei Halten (Luftlinie); Valhalla-Wege bis zum Doppelten
  access:
    name: Zugangsweg (m)
    description: Längster Weg vom Start zum ersten bzw. vom letzten Halt zum Ziel (Luftlinie)
  par:
    name: Gleichzeitige Anfragen
    description: Mehr Anfragen gleichzeitig kosten mehr RAM
network:
  8090/tcp: Routing-API, nur über den Reverse Proxy mit Client-Zertifikat freigeben
