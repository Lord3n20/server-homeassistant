configuration:
  job:
    name: Jobs
    description: Durch Komma getrennt, werden nacheinander ausgeführt (gtfs, osm, valhalla, footpaths, geocode, map, rwth)
  gtfs_box:
    name: Nahverkehrs-Box
    description: Fahrten mit mindestens einem Halt in diesem Rechteck (minlon,minlat,maxlon,maxlat) kommen in den Fahrplan
  osm_tage:
    name: OSM-Abstand (Tage)
    description: OSM und Valhalla erst neu bauen, wenn der Stand so alt ist (0 = bei jedem Lauf prüfen)
  map_box:
    name: Kartenausschnitt
    description: Gesamtausschnitt, alle Regionen liegen darin (minlon,minlat,maxlon,maxlat)
  map_zoom:
    name: Karten-Zoom
    description: Höchste Zoomstufe; jede Stufe mehr vervierfacht etwa die Größe
  osm_sources:
    name: OSM-Quellen
    description: Geofabrik-Pfade ohne „-latest.osm.pbf“; zusammen müssen sie das Regionspolygon abdecken
  geocode_sources:
    name: Quellen der Adresssuche
    description: Ganze Geofabrik-Gebiete ohne „-latest.osm.pbf“ (z. B. europe/germany); unabhängig vom Regionspolygon
  max_mem_mb:
    name: Speicherspitze (MB)
    description: Der Job bricht ab, wenn er mehr belegt; zusätzlich nie mehr als der freie Speicher minus 1 GB
  concurrency:
    name: Threads
    description: Threads für den Valhalla-Bau (höchstens 4, damit andere Dienste genug CPU behalten)
  force:
    name: Neu bauen erzwingen
    description: Auch bei unveränderten Quellen neu bauen
  map_uebersicht_zoom:
    name: Höchste Zoomstufe der Übersicht
    description: Übersicht: höchste Zoomstufe (ganzer Kartenausschnitt, grob)
  map_tage:
    name: Karte: Tage bis zum Neuschneiden
    description: Karte erst neu holen, wenn der Stand so alt ist (0 = immer prüfen)
