configuration:
  gtfs:
    name: GTFS feeds
    description: Files in the app config folder, comma separated. ":fern" marks a feed as long-distance (not covered by the Deutschlandticket)
  gtfs_dir:
    name: Timetable folder
    description: Folder of the GTFS feeds (wildcard allowed), by default the current data of the jobs app. Leave empty to use this app's config folder
  footpaths:
    name: Footpaths
    description: "Precomputed Valhalla footpaths (CSV, wildcard allowed), by default from the jobs app. Empty or not found: straight-line distance"
  geocode:
    name: Search list
    description: Addresses, places and RWTH buildings for search (geocode and rwth jobs, comma-separated, wildcard allowed). Empty or not found – search off
  map:
    name: Map
    description: Map folder (map/current of the jobs app) for the app. Empty or not found – no map
  rt:
    name: Realtime feed
    description: GTFS-RT URL; fetched only on requests, at most every 30 s. Empty – timetable only
  walk:
    name: Transfer walk (m)
    description: Longest walk between two stops (straight line); Valhalla paths up to twice that
  access:
    name: Access walk (m)
    description: Search radius for stops around start and destination (straight line); with Valhalla, real paths up to twice that
  valhalla:
    name: Valhalla
    description: Address of the Valhalla app for real access paths. Leave empty to use straight-line distance
  par:
    name: Parallel requests
    description: More parallel requests use more RAM
network:
  8090/tcp: Routing API, expose only via the reverse proxy with client certificates
