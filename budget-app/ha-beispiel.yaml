# Für configuration.yaml, Block rest_command:
#
#   budget:
#     url: "http://91c9b2fc-budget:8098/werkzeug/{{ werkzeug }}"
#     method: POST
#     content_type: application/json
#     payload: "{{ daten | tojson }}"
#     timeout: 20
#
# Für automations.yaml (Bankumsätze aus der Chromium-Erweiterung; Kennung geheim halten):
#
#   - id: budget_bank_einreichen
#     alias: "Budget: Bankumsätze aus der Erweiterung"
#     mode: queued
#     triggers:
#     - trigger: webhook
#       webhook_id: budget-bank-…
#       allowed_methods: [POST]
#       local_only: true
#     actions:
#     - action: rest_command.budget
#       data:
#         werkzeug: bank_einreichen
#         daten: "{{ trigger.json }}"
#
# Für scripts.yaml. Die Felder gehen gesammelt als dict in die Daten: einzeln würde
# Home Assistant aus Text wie "12,34" beim Auswerten die Liste [12, 34] machen.

budget_kategorien:
  alias: "Budget: Kategorien und Zahlkonten"
  description: "Listet die gültigen Ausgaben- und Einnahmekategorien und die Namen der Zahlkonten, ohne Salden und Beträge. Vor dem ersten Vorschlag aufrufen."
  icon: mdi:cash-multiple
  mode: parallel
  sequence:
  - action: rest_command.budget
    data:
      werkzeug: kategorien_und_zahlkonten
      daten: {}
    response_variable: r
  - variables:
      antwort: "{{ {'ergebnis': r.content} }}"
  - stop: Fertig
    response_variable: antwort

budget_ausgabe_vorschlagen:
  alias: "Budget: Ausgabe vorschlagen"
  description: "Legt eine Ausgabe, etwa von einem Kassenbon, als Vorschlag an und prüft Summe und Duplikate. Bucht noch nicht. Das Ergebnis dem Nutzer zeigen und erst nach seinem OK bestätigen. Einnahmen gehen über budget_einnahme_vorschlagen, Umbuchungen über budget_umbuchung_vorschlagen. Steht als Kategorie eine Einnahmekategorie oder ein Zahlkonto, wird daraus automatisch eine Einnahme bzw. Umbuchung."
  icon: mdi:cash-multiple
  mode: parallel
  fields:
    datum:
      description: "Datum als JJJJ-MM-TT"
      required: true
      selector:
        text: {}
    beschreibung:
      description: "Händler oder Zweck"
      required: true
      selector:
        text: {}
    zahlkonto:
      description: "Name des Zahlkontos aus budget_kategorien"
      required: true
      selector:
        text: {}
    positionen:
      description: "JSON-Liste, z. B. [{\"kategorie\": \"Ausgaben:Lebensmittel\", \"betrag\": \"12,34\", \"memo\": \"Äpfel\"}]"
      required: true
      selector:
        text: {}
    bonsumme:
      description: "Summe laut Bon, wird gegen die Positionen geprüft"
      required: false
      selector:
        text: {}
  sequence:
  - action: rest_command.budget
    data:
      werkzeug: ausgabe_vorschlagen
      daten: "{{ dict(datum=datum, beschreibung=beschreibung, zahlkonto=zahlkonto, positionen=positionen, bonsumme=bonsumme | default('')) }}"
    response_variable: r
  - variables:
      antwort: "{{ {'ergebnis': r.content} }}"
  - stop: Fertig
    response_variable: antwort

budget_einnahme_vorschlagen:
  alias: "Budget: Einnahme vorschlagen"
  description: "Legt eine Einnahme (Lohn, BAföG, Erstattung von außen o. Ä.) als Vorschlag an und prüft Duplikate. Bucht noch nicht. Dem Nutzer zeigen und nach seinem OK mit budget_ausgabe_bestaetigen buchen. Gebuchte Einnahmen und Salden lassen sich nicht lesen."
  icon: mdi:cash-plus
  mode: parallel
  fields:
    datum:
      description: "Datum als JJJJ-MM-TT"
      required: true
      selector:
        text: {}
    beschreibung:
      description: "Absender oder Zweck"
      required: true
      selector:
        text: {}
    zahlkonto:
      description: "Konto, auf dem das Geld eingeht (Name aus budget_kategorien, zahlkonten)"
      required: true
      selector:
        text: {}
    kategorie:
      description: "Einnahmekategorie aus budget_kategorien, einnahmekategorien"
      required: true
      selector:
        text: {}
    betrag:
      description: "Betrag in Euro, z. B. 520,00"
      required: true
      selector:
        text: {}
    memo:
      description: "Notiz"
      required: false
      selector:
        text: {}
  sequence:
  - action: rest_command.budget
    data:
      werkzeug: einnahme_vorschlagen
      daten: "{{ dict(datum=datum, beschreibung=beschreibung, zahlkonto=zahlkonto, kategorie=kategorie, betrag=betrag, memo=memo | default('')) }}"
    response_variable: r
  - variables:
      antwort: "{{ {'ergebnis': r.content} }}"
  - stop: Fertig
    response_variable: antwort

budget_umbuchung_vorschlagen:
  alias: "Budget: Umbuchung vorschlagen"
  description: "Legt eine Umbuchung zwischen zwei eigenen Zahlkonten (z. B. Girokonto auf Verrechnungskonto) als Vorschlag an und prüft Duplikate. Bucht noch nicht. Dem Nutzer zeigen und nach seinem OK mit budget_ausgabe_bestaetigen buchen. Salden lassen sich nicht lesen."
  icon: mdi:bank-transfer
  mode: parallel
  fields:
    datum:
      description: "Datum als JJJJ-MM-TT"
      required: true
      selector:
        text: {}
    von:
      description: "Zahlkonto, von dem das Geld abgeht (Name aus budget_kategorien, zahlkonten)"
      required: true
      selector:
        text: {}
    auf:
      description: "Zahlkonto, auf dem das Geld ankommt (Name aus budget_kategorien, zahlkonten)"
      required: true
      selector:
        text: {}
    betrag:
      description: "Betrag in Euro, z. B. 200,00"
      required: true
      selector:
        text: {}
    beschreibung:
      description: "Zweck, z. B. Sparen"
      required: false
      selector:
        text: {}
    memo:
      description: "Notiz"
      required: false
      selector:
        text: {}
  sequence:
  - action: rest_command.budget
    data:
      werkzeug: umbuchung_vorschlagen
      daten: "{{ dict(datum=datum, von=von, auf=auf, betrag=betrag, beschreibung=beschreibung | default(''), memo=memo | default('')) }}"
    response_variable: r
  - variables:
      antwort: "{{ {'ergebnis': r.content} }}"
  - stop: Fertig
    response_variable: antwort

budget_ausgabe_bestaetigen:
  alias: "Budget: Ausgabe buchen"
  description: "Bucht einen Vorschlag (Ausgabe, Einnahme oder Umbuchung), nachdem der Nutzer ihn bestätigt hat. Ein zweiter Aufruf bucht nicht noch einmal."
  icon: mdi:cash-multiple
  mode: parallel
  fields:
    vorschlag_id:
      description: "Nummer aus dem Vorschlag"
      required: true
      selector:
        text: {}
    trotz_duplikat:
      description: "Nur true, wenn der Nutzer ein mögliches Duplikat ausdrücklich bestätigt hat"
      required: false
      selector:
        boolean: {}
  sequence:
  - action: rest_command.budget
    data:
      werkzeug: ausgabe_bestaetigen
      daten: "{{ dict(vorschlag_id=vorschlag_id, trotz_duplikat=trotz_duplikat | default('')) }}"
    response_variable: r
  - variables:
      antwort: "{{ {'ergebnis': r.content} }}"
  - stop: Fertig
    response_variable: antwort

budget_vorschlag_verwerfen:
  alias: "Budget: Vorschlag verwerfen"
  description: "Verwirft einen offenen Vorschlag."
  icon: mdi:cash-multiple
  mode: parallel
  fields:
    vorschlag_id:
      description: "Nummer aus dem Vorschlag"
      required: true
      selector:
        text: {}
  sequence:
  - action: rest_command.budget
    data:
      werkzeug: vorschlag_verwerfen
      daten: "{{ dict(vorschlag_id=vorschlag_id) }}"
    response_variable: r
  - variables:
      antwort: "{{ {'ergebnis': r.content} }}"
  - stop: Fertig
    response_variable: antwort

budget_ausgaben_lesen:
  alias: "Budget: Ausgaben lesen"
  description: "Liest gebuchte Ausgaben, optional nach Zeitraum und Suchwort. Erstattungen erscheinen als negative Beträge. Salden und Einnahmen sind bewusst nicht verfügbar."
  icon: mdi:cash-multiple
  mode: parallel
  fields:
    von:
      description: "Ab Datum JJJJ-MM-TT"
      required: false
      selector:
        text: {}
    bis:
      description: "Bis Datum JJJJ-MM-TT"
      required: false
      selector:
        text: {}
    suche:
      description: "Suchwort in Beschreibung oder Notiz"
      required: false
      selector:
        text: {}
  sequence:
  - action: rest_command.budget
    data:
      werkzeug: ausgaben_lesen
      daten: "{{ dict(von=von | default(''), bis=bis | default(''), suche=suche | default('')) }}"
    response_variable: r
  - variables:
      antwort: "{{ {'ergebnis': r.content} }}"
  - stop: Fertig
    response_variable: antwort

budget_ausgabe_stornieren:
  alias: "Budget: Ausgabe stornieren"
  description: "Entfernt eine gebuchte Ausgabe, wenn der Nutzer das verlangt."
  icon: mdi:cash-multiple
  mode: parallel
  fields:
    id:
      description: "Nummer der Ausgabe aus budget_ausgaben_lesen"
      required: true
      selector:
        text: {}
  sequence:
  - action: rest_command.budget
    data:
      werkzeug: ausgabe_stornieren
      daten: "{{ dict(id=id) }}"
    response_variable: r
  - variables:
      antwort: "{{ {'ergebnis': r.content} }}"
  - stop: Fertig
    response_variable: antwort

budget_monatsauswertung:
  alias: "Budget: Monatsauswertung"
  description: "Ausgaben eines Monats je Kategorie im Vergleich zum Vormonat."
  icon: mdi:cash-multiple
  mode: parallel
  fields:
    monat:
      description: "Monat als JJJJ-MM"
      required: true
      selector:
        text: {}
  sequence:
  - action: rest_command.budget
    data:
      werkzeug: monatsauswertung
      daten: "{{ dict(monat=monat) }}"
    response_variable: r
  - variables:
      antwort: "{{ {'ergebnis': r.content} }}"
  - stop: Fertig
    response_variable: antwort

budget_wiederkehrende_ausgaben:
  alias: "Budget: Wiederkehrende Ausgaben"
  description: "Listet die im Panel eingestellten wiederkehrenden Ausgaben."
  icon: mdi:cash-multiple
  mode: parallel
  sequence:
  - action: rest_command.budget
    data:
      werkzeug: wiederkehrende_ausgaben
      daten: {}
    response_variable: r
  - variables:
      antwort: "{{ {'ergebnis': r.content} }}"
  - stop: Fertig
    response_variable: antwort

budget_monatsbericht_speichern:
  alias: "Budget: Bericht speichern"
  description: "Speichert einen Monats- oder Wochenbericht, damit er im Budget-Panel erscheint."
  icon: mdi:cash-multiple
  mode: parallel
  fields:
    monat:
      description: "Monat als JJJJ-MM oder Woche als JJJJ-Www, z. B. 2026-W45"
      required: true
      selector:
        text: {}
    text:
      description: "Nur zwei oder drei kurze Sätze, die Grafiken zeigt das Panel selbst"
      required: true
      selector:
        text: {}
    vorschlaege:
      description: 'Sparvorschläge als JSON-Liste, z. B. [{"titel": "Abo kündigen", "betrag": "17,00", "kategorie": "Ausgaben:Abos & Digitales"}]; Betrag pro Monat, Kategorie freiwillig (markiert im Panel, wo sich sparen ließe)'
      required: false
      selector:
        text: {}
  sequence:
  - action: rest_command.budget
    data:
      werkzeug: monatsbericht_speichern
      daten: "{{ dict(monat=monat, text=text, vorschlaege=vorschlaege | default('')) }}"
    response_variable: r
  - variables:
      antwort: "{{ {'ergebnis': r.content} }}"
  - stop: Fertig
    response_variable: antwort

