name: "Nextcloud-Brücke"
description: "Stellt Nextcloud-Ordner per rclone nur lesend (ohne Plattencache) als NFS-v3-Freigabe im internen App-Netz bereit, z. B. für Immich"
version: "0.2.0"
slug: "nextcloud_bruecke"
arch:
  - aarch64
  - amd64
startup: system
boot: auto
init: false
watchdog: "tcp://[HOST]:2049"
environment:
  TZ: "Europe/Berlin"
options:
  webdav_url: ""
  benutzer: ""
  app_passwort: ""
  ordner:
    - name: "Bilder"
      pfad: "Bilder"
  ram_puffer_mb: 32
schema:
  webdav_url: url
  benutzer: str
  app_passwort: password
  ordner:
    - name: match(^[A-Za-z0-9_\-]+$)
      pfad: str
  ram_puffer_mb: int(0,512)
