name: "Morgen-Briefing"
description: "Tägliches Briefing ohne KI: Termine, Mails mit Kurzfassung, Fristen und Kalender-Wecker"
version: "1.0.0"
slug: "morgen_briefing"
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false
homeassistant_api: true
hassio_api: true
ingress: true
ingress_port: 8080
panel_icon: "mdi:weather-sunset-up"
panel_title: "Briefing"
watchdog: "http://[HOST]:[PORT:8080]/gesund"
options:
  uhrzeit: "05:00"
  imap_host: "imap.ionos.de"
  imap_benutzer: ""
  imap_passwort: ""
  caldav_url: "https://nc.enzoth.ink/remote.php/dav/calendars/Enzo/"
  caldav_benutzer: "Enzo"
  caldav_passwort: ""
  kalender_ausschliessen:
    - "sempro"
    - "sempross26"
  push_dienst: "mobile_app_pixel_8"
schema:
  uhrzeit: "match(^([01][0-9]|2[0-3]):[0-5][0-9]$)"
  imap_host: str
  imap_benutzer: str
  imap_passwort: "password"
  caldav_url: url
  caldav_benutzer: str
  caldav_passwort: "password"
  kalender_ausschliessen:
    - str
  push_dienst: "str?"
