name: "Nextcloud-Brücke"
description: "Stellt Nextcloud-Ordner per rclone nur lesend (Cache nur im RAM) als NFS-v3-Freigabe im internen App-Netz bereit, z. B. für Immich"
version: "0.3.0"
slug: "nextcloud_bruecke"
arch:
  - aarch64
  - amd64
startup: system
boot: auto
init: false
tmpfs: true
watchdog: "tcp://[HOST]:2049"
environment:
  TZ: "Europe/Berlin"
options:
  webdav_url: ""
  benutzer: ""
  app_passwort: ""
  ordner:
    - name: "Bilder"
      pfad: "Bilder"
  ram_cache_mb: 1024
schema:
  webdav_url: url
  benutzer: str
  app_passwort: password
  ordner:
    - name: match(^[A-Za-z0-9_\-]+$)
      pfad: str
  ram_puffer_mb: int(0,512)?
  ram_cache_mb: int(256,4096)?
